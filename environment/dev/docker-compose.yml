# Development only: identity providers for signing in locally. Production brings its own OIDC provider.
# Pinned so the project (and its pocket-id-data volume) keeps the name it had when the file sat at the repository root.
name: file-browser

services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3
    ports:
      - "8090:8080"
    environment:
      JSON_CONFIG_PATH: /config/mock-oauth2-server.json
    volumes:
      - ./oidc/mock-oauth2-server.json:/config/mock-oauth2-server.json:ro

  # password sign-in for dev, usable in any browser: admin@example.com / admin, alice@example.com / alice
  dex:
    image: ghcr.io/dexidp/dex:v2.46.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.1
    ports:
      - "1411:1411"
    environment:
      APP_URL: http://localhost:1411
      # Dev-only default; never reuse it for a real deployment.
      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY:-dev-only-insecure-encryption-key}
    volumes:
      - pocket-id-data:/app/data

  # Test shares for checking NFS/SMB detection; start with `docker compose -f environment/dev/docker-compose.yml --profile shares up -d`.
  # Mounting them on the host needs root, see the README.
  smb:
    image: ghcr.io/servercontainers/samba:latest
    profiles: [shares]
    ports:
      - "127.0.0.1:445:445"
    environment:
      ACCOUNT_test: "test"
      UID_test: "1000"
      SAMBA_VOLUME_CONFIG_share: "[share]; path = /shares/share; valid users = test; guest ok = no; read only = no; browseable = yes"
    volumes:
      - ../../data/shares/smb:/shares/share

  nfs:
    image: ghcr.io/obeone/nfs-server:latest
    profiles: [shares]
    # uses the host kernel's NFS server and loads the nfsd module, which needs full privileges
    privileged: true
    ports:
      - "127.0.0.1:2049:2049"
    environment:
      NFS_VERSION: "4.2"
      NFS_DISABLE_VERSION_3: "1"
      NFS_EXPORT_0: "/export *(rw,fsid=0,insecure,no_subtree_check,no_root_squash)"
    volumes:
      - ../../data/shares/nfs:/export
      - /lib/modules:/lib/modules:ro

  # S3-compatible storage for trying out S3 file systems; start with
  # `docker compose -f environment/dev/docker-compose.yml --profile s3 up -d`. Console on http://localhost:9001.
  rustfs:
    image: rustfs/rustfs:1.0.1
    profiles: [s3]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: dev-access-key
      RUSTFS_SECRET_KEY: dev-secret-key
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data

  # one-shot: creates dev-bucket with a few files, including team-a/ and team-b/ for bucket-folder roots,
  # and public-bucket, readable without keys
  rustfs-seed:
    image: amazon/aws-cli:2.37.9
    profiles: [s3]
    depends_on: [rustfs]
    environment:
      AWS_ACCESS_KEY_ID: dev-access-key
      AWS_SECRET_ACCESS_KEY: dev-secret-key
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws s3 ls >/dev/null 2>&1; do sleep 1; done
        mkdir -p /tmp/seed/team-a/Reports /tmp/seed/team-b
        echo "Welcome to the dev bucket." > /tmp/seed/README.md
        echo "Quarterly numbers" > /tmp/seed/team-a/Reports/q3.txt
        echo "Team A notes" > /tmp/seed/team-a/notes.md
        echo "Team B plan" > /tmp/seed/team-b/plan.md
        if ! aws s3 ls s3://dev-bucket >/dev/null 2>&1; then
          aws s3 mb s3://dev-bucket
          aws s3 cp --recursive /tmp/seed s3://dev-bucket/
        fi
        if ! aws s3 ls s3://public-bucket >/dev/null 2>&1; then
          aws s3 mb s3://public-bucket
          aws s3 cp /tmp/seed/README.md s3://public-bucket/README.md
          aws s3api put-bucket-policy --bucket public-bucket --policy '{"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Principal": "*", "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:GetObject"], "Resource": ["arn:aws:s3:::public-bucket", "arn:aws:s3:::public-bucket/*"]}]}'
        fi

volumes:
  pocket-id-data:
  rustfs-data:
