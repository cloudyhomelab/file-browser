# Development profile: signs in against the providers from environment/dev/docker-compose.yml.
spring.security.oauth2.client.registration.mock.client-id=filebrowser
spring.security.oauth2.client.registration.mock.client-secret=dev-only-secret
spring.security.oauth2.client.registration.mock.scope=openid,email,profile
spring.security.oauth2.client.provider.mock.issuer-uri=http://localhost:8090/dev
filebrowser.oidc.mock.label=Mock OIDC (dev)
filebrowser.oidc.mock.icon=generic
spring.security.oauth2.client.registration.dex.client-id=filebrowser
spring.security.oauth2.client.registration.dex.client-secret=dev-only-secret
spring.security.oauth2.client.registration.dex.scope=openid,email,profile
spring.security.oauth2.client.provider.dex.issuer-uri=http://localhost:5556/dex
filebrowser.oidc.dex.label=Dex (dev)
filebrowser.oidc.dex.icon=generic
filebrowser.admin-emails=admin@example.com
# dev-only key for stored S3 credentials (relative to the project folder); never reuse it for a real deployment
filebrowser.secret-key-file=environment/dev/secret-key
